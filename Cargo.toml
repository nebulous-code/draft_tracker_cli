[package]
name = "draft_tracker"
version = "0.0.1"
edition = "2024"
description = "Track writing sessions, projects and word counts in a terminal UI backed by SQLite"
license = "MIT"
readme = "README.md"
repository = "https://github.com/nebulous-code/draft_tracker"
keywords = ["writing", "tui", "sqlite", "wordcount"]
categories = ["command-line-utilities"]
default-run = "draft-tracker"

[[bin]]
name = "draft-tracker"
path = "src/main.rs"

[lib]
name = "draft_tracker"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.104"
calamine = { version = "0.36.1", features = ["dates"] }
chrono = "0.4.45"
csv = "1.4.0"
dirs = "7.0.0"
ratatui = "0.30.2"
rusqlite = { version = "0.40.2", features = ["bundled", "chrono"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2.0.21"
toml = "1"

[profile.release]
# Whole-program optimization and a single codegen unit: this is a tool built
# occasionally and run for years, so a slower build for a faster, smaller binary
# is the right trade. Symbols are stripped because nothing here gets debugged
# from a core dump.
lto = true
codegen-units = 1
strip = "symbols"
# `panic = "abort"` is deliberately not set. The terminal is restored by a panic
# hook, which would still run, but aborting skips every destructor including the
# SQLite connection's, and a writing log is not worth that risk to save a few
# kilobytes.
